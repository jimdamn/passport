name = "krowdkraft-passport"
pages_build_output_dir = "ui/dist"
compatibility_date = "2024-06-14"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "krowdkraft-passport"
database_id = "c2621221-e1c5-45e5-980c-5dddf38aaa9b"

[[kv_namespaces]]
binding = "PASSPORT_CONFIG"
id = "ee180c4b25fa4b0795e6afe0dd09a9c1"

[[services]]
binding = "KKAUTH"
service = "kkauth"

[[services]]
binding = "KKCREDITS"
service = "kkcredits"

[[services]]
binding = "KKGAME"
service = "kkgame"

[[r2_buckets]]
binding = "SITE_ASSETS"
bucket_name = "site-image-assets"

[vars]
ENVIRONMENT = "production"
COOKIE_DOMAIN = ".lakeandlocals.com"
HUB_URL = "https://business.lakeandlocals.com"
FIELD_NOTES_BASE_URL = "https://fieldnotes.lakeandlocals.com"
# Deals escrow account in KKCredits (must match ESCROW_ACCOUNTS["passport"]
# in KKCredits wrangler.toml). Claims hold funds here until settled to the
# merchant on redemption or returned to the member on expiry.
DEALS_ESCROW_UID = "900000101"
# Cloudflare account id — Stream API path segment (Social Splash Increment 5). Not sensitive on its own.
STREAM_ACCOUNT_ID = "943518e1efbb7399d5f04cdf63233024"
# Stream customer subdomain that serves signed playback/download URLs. Same for every video on this account.
# Discovered live during Gate 5 testing (2026-07-26) via a real uploaded test clip's `preview` field.
STREAM_PLAYBACK_DOMAIN = "https://customer-hqbke3zzo85ur2y9.cloudflarestream.com"

# Secrets — set via: wrangler pages secret put <NAME>
# INTERNAL_SECRET  — Shared secret for KKAuth internal calls
# GEO_TOKEN_SECRET — long random string for verifying kk_geo_trust JWT cookies
#                    Must match the value set in kk-apps-hub and kk-login.
# KKAUTH_APP_KEY   — API key registered in KKAuth apps table for this Worker (also used as X-App-Key for KKCredits)
# KKGAME_APP_KEY   — API key registered in KKAuth apps table for this Worker (used as X-App-Key for KKGame)
# QR_SIGNING_SECRET — HMAC-SHA256 signing secret for standardized QR payloads
# RESEND_API_KEY   — Resend API key for guest claim-code emails (optional; claim emails skip if unset)
# SPLASH_MEDIA_SECRET — HMAC secret for Social Splash's short-TTL signed media-view URLs (Pages secret - needs a redeploy to take effect)
# STREAM_API_TOKEN — Cloudflare API token, account-wide Stream:Edit scope (Social Splash Increment 5)
# STREAM_KEY_ID    — Stream signing key id, from the one-time src/lib/stream.ts createSigningKey call
# STREAM_JWK       — Stream signing key private JWK (base64), same one-time call


